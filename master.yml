---
- name: Set up arch box
  hosts: all
  roles:
    - system
    - role: disks
    # A little redundant, but I typo this enough to have both
      when:
        - "'vm' not in group_names"
        - "'vms' not in group_names"
        - "'pi' not in group_names"
        - "'pis' not in group_names"
    - editor
    - mounts
    - backups
    - containers
    - terminal
    - role: artis3n.tailscale.machine
      when: "'tailscale' in group_names"
      tags: tailscale
    - notifications
    - file_manager
    - reverse_proxy
    - drift_management
    - role: database_server
      tags: postgres
    - role: budget_server
      tags: actual
    - role: feed_server
      tags: miniflux
    - role: photo_server
      tags: immich
    - role: bookmark_server
      tags: karakeep
    - role: document_server
      tags: paperless
    - role: version_control_server
      tags: forgejo
    - role: home_automation_server
      tags: homeassistant
    - role: directory_server
      tags: lldap
    - role: auth_server
      tags: authelia
    - role: note_server
      tags: memos
    - role: ai_server
      tags: openwebui
    - role: geerlingguy.swap
      become: true
      vars:
        swap_file_size_mb: '2048'
        swap_file_create_command: >-
          btrfs filesystem mkswapfile --size {{ swap_file_size_mb }}m {{ swap_file_path }}
      tags: swap
